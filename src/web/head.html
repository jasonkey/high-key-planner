<title>High Key Planner</title>
<style>
:root{
  --ink:#1c2430; --muted:#6b7785; --line:#d8dee6; --bg:#f6f7f9; --card:#fff;
  --dark:#2f3e52; --accent:#44607f; --accentbg:#e8edf2;
  --late:#ffe2e8; --lateink:#9c1f3e; --early:#fce4d6; --earlyink:#7f2a2a;
  --event:#fff2cc; --closed:#d9d9d9; --exam:#f3e8ef; --examink:#7b4b6b; --mcas:#e4eef6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
header.top{background:var(--dark);color:#fff;padding:28px 0;margin-bottom:24px}
header.top .wrap{padding-bottom:0}
h1{margin:0 0 6px;font-size:24px;letter-spacing:.01em}
h1 .sub{font-weight:400;font-size:17px;color:#b9c7d6;letter-spacing:0}
header.top p{margin:0;color:#c6d2de;font-size:14px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
.step{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:17px;font-weight:600}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:2px 0 14px 36px}
textarea{width:100%;min-height:150px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding:12px;border:1px solid var(--line);border-radius:8px;background:#fcfcfd;resize:vertical;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
button{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:7px;cursor:pointer}
button.ghost{background:#fff;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
table.edit{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
@media (max-width:560px){table.edit{font-size:12.5px}table.edit th:nth-child(6),table.edit td:nth-child(6){display:none}}
table.edit th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
table.edit td{padding:5px 8px;border-bottom:1px solid #eef1f4;vertical-align:middle}
table.edit input{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink)}
.noterow-tr td{border-bottom:1px solid #eef1f4;padding-top:0}
.cnotes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 0 6px}
.cnote{display:inline-flex;gap:4px;align-items:center;background:#f4f7fa;border:1px solid var(--line);border-radius:7px;padding:3px 4px 3px 6px}
.cnote input{width:240px;font-size:12.5px;padding:4px 6px}
.cnote select{font-size:12px;padding:3px 4px}
button.mini{font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:#fff;color:var(--accent)}
button.mini.add{border-style:dashed}
table.week .cnotep{display:block;font-size:8.5px;color:#3d5166;font-style:italic;margin-top:1px}
.grid .cnotep{display:block;font-size:10.5px;color:#3d5166;font-style:italic}
.blk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;
  background:var(--accentbg);color:var(--accent);font-weight:700;font-size:13px}
.meets{font-size:12px;color:var(--muted);white-space:nowrap}
.msg{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:13.5px;display:none}
.msg.ok{background:#e8f3ec;color:#20613c;display:block}
.msg.warn{background:#fdf1e3;color:#7f4f00;display:block}
.msg.err{background:#fbe9e9;color:#8c2222;display:block}
.warnchip{display:inline-block;font-size:11px;font-weight:700;color:#7f4f00;background:var(--event);border-radius:5px;padding:1px 6px;margin-left:6px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroller>table{min-width:760px}
@media print{.scroller{overflow:visible}.scroller>table{min-width:0}}
.grid{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px;table-layout:fixed}
.grid th,.grid td{border:1px solid var(--line);padding:6px 5px;text-align:center;vertical-align:middle}
.grid thead th{background:var(--accent);color:#fff;font-size:11.5px;letter-spacing:.04em}
.grid th.rowlab{background:var(--accentbg);font-size:11px;color:var(--ink);width:96px}
.grid .free{color:#9aa4af;font-style:italic}
.grid .arr{font-weight:700;color:#1f3864;background:var(--accentbg)}
.grid .arr.late{color:var(--lateink);background:var(--late)}
.grid .dis{font-weight:700;color:#1f3864;background:var(--accentbg)}
.grid .dis.early{color:var(--earlyink);background:var(--early)}
.cname{font-weight:700;display:block}
.cmeta{font-size:11px;color:#4a5563;display:block}
.opts{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.noteset{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.noterow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nlab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:104px}
.days{display:inline-flex;gap:4px}
.days label{font-size:12px;display:inline-flex;align-items:center;gap:3px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.days input{margin:0}
table.week .bs{background:#eef4ec;color:#2c5340;font-size:9px;font-weight:700;height:18px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0 0}
legend{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:0 6px}
label.inline{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:13.5px}
select,input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
details{margin-top:10px}
summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:600}
.fine{font-size:12.5px;color:var(--muted);margin-top:8px}
code.k{background:#eef1f4;padding:1px 5px;border-radius:4px;font-size:12.5px}
#printArea{display:none}
@media print{
  body{background:#fff}
  header.top,.wrap>.card,.noprint{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  #printArea{display:block}
  @page{size:letter landscape;margin:8mm}
  .wk{page-break-after:always;break-after:page;page-break-inside:avoid}
  .wk:last-child{page-break-after:auto;break-after:auto}
}
.wk{margin-bottom:26px}
table.week{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}
table.week{page-break-inside:avoid;break-inside:avoid}
table.week td,table.week th{border:1px solid #b7b7b7;padding:2px;text-align:center;vertical-align:middle;line-height:1.25}
table.week .title{background:var(--dark);color:#fff;font-size:12.5px;font-weight:700;padding:5px;letter-spacing:.02em}
table.week .dayhdr{background:var(--accent);color:#fff;font-size:11px;font-weight:700}
table.week .rowlab{background:#fff;font-size:9px;width:12%}
table.week .rowlab.k{background:var(--accentbg);font-weight:700}
table.week .times{font-size:8px;color:#1f3864;width:14%}
table.week .daynum{background:var(--dark);color:#fff;font-size:12px;font-weight:700}
table.week .note{background:#f2f2f2;font-size:8.5px;font-weight:700;color:#7f4f00;height:17px}
table.week .note.has{background:var(--event)}
table.week .arr{background:var(--accentbg);font-weight:700;font-size:11.5px;color:#1f3864;height:24px}
table.week .arr.late{background:var(--late);color:var(--lateink);font-size:10px}
table.week .dis{background:var(--accentbg);font-weight:700;font-size:11.5px;color:#1f3864;height:22px}
table.week .dis.early{background:var(--early);color:var(--earlyink)}
table.week .z{font-size:8px;color:#7f7f7f;height:14px}
table.week .cls{height:34px}
table.week .cls .cname{font-size:10px;font-weight:700}
table.week .cls .cmeta{font-size:9px;color:#333}
table.week .free{background:#f7f7f7;color:#8c8c8c;font-style:italic;font-size:9px}
table.week .closed{background:var(--closed);color:#7f7f7f;font-weight:700}
table.week .exam{background:var(--exam);color:var(--examink)}
table.week .examhdr{background:var(--examink);color:#fff;font-weight:700;font-size:11px}
table.week .mcas{background:var(--mcas);color:#1f3864}
table.week .mcashdr{background:#3f6e8c;color:#fff;font-weight:700;font-size:11px}
table.week .spechdr{background:var(--early);color:var(--earlyink);font-weight:700;font-size:11px}
table.week .afthdr{background:var(--accent);color:#fff;font-size:9px;font-weight:700;text-align:left;padding-left:6px}
table.week .eve{height:18px}
table.week .eve.lab{font-size:9px}
table.week .eve.dinner{background:var(--event);font-weight:700}
</style>
