# Publishes site/ to GitHub Pages.
#
# Pages cannot serve an arbitrary folder when deploying from a branch — only the
# repo root or /docs — and /docs here holds district-sources.md, not the site.
# So the site is uploaded as an artifact instead, and site/ stays where it is.
#
# The checks run on pull requests as well as on main. On main alone a failure
# aborts the deploy and Pages keeps serving the previous build, which leaves the
# branch broken and the live site quietly out of step with it. Running them on
# the PR is what actually stops a stale page from landing.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install openpyxl
        run: pip install openpyxl

      # site/index.html and src/district_data.json are generated but committed.
      # Regenerating must be a no-op; if it is not, the committed page is stale
      # and would be published with calendar data that planner.py has moved past.
      - name: Check the committed page is in sync with planner.py
        run: |
          cd src
          python gen_district_data.py
          python assemble.py
          cd ..
          if ! git diff --quiet -- site/index.html src/district_data.json; then
            echo "::error::site/index.html or src/district_data.json is stale."
            echo "Run 'cd src && python gen_district_data.py && python assemble.py' and commit the result."
            git diff --stat -- site/index.html src/district_data.json
            exit 1
          fi
          echo "In sync."

      - name: Verify the workbook build against the district block calendar
        run: |
          cd workbooks
          python build.py --blank
          python build.py ../students/example.py
          python verify.py | tee /tmp/verify.out
          grep -q 'TOTAL ERRORS: 0' /tmp/verify.out

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
